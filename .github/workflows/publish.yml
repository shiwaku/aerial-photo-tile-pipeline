# main に入るたびに、amd64 / arm64 の両方を含むイメージを GHCR に公開する。
#   ghcr.io/<owner>/aerial-photo-tile-pipeline:latest と :sha-<短いハッシュ>
# 中に入るのはスクリプトとサンプル設定だけ（.dockerignore 参照）。
# arm64 は QEMU でビルドする。重い処理はベースイメージ側にあり、ここでは pip install だけなので十分速い。
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
