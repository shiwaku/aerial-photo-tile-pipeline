<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>航空写真オルソ画像ビューワ</title>
  <meta name="description" content="航空写真（正射画像）から生成した XYZ タイル / PMTiles を表示するビューワ" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#2a78d6" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="オルソ画像" />
  <script type="module" crossorigin src="./assets/index-BsOnE2T5.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BZAQw8aa.css">
</head>
<body>
  <div id="map"></div>

  <section id="panel" class="panel" aria-label="コントロールパネル">
    <header class="panel-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🛩️</span>
        <h1 id="title">航空写真オルソ画像ビューワ</h1>
      </div>
      <div class="head-actions">
        <button id="theme-btn" class="icon-btn" type="button" title="テーマ切替" aria-label="テーマ切替"></button>
        <button id="collapse-btn" class="icon-btn" type="button" title="パネル開閉" aria-label="パネル開閉"></button>
      </div>
    </header>

    <div id="panel-body" class="panel-body">
      <div class="field">
        <div class="field-head">
          <span class="field-label">ズームレベル</span>
        </div>
        <div class="scale-row">
          <span id="zoom-badge" class="scale-badge">Z–</span>
          <span id="zoom-note" class="scale-note"></span>
        </div>
      </div>

      <div class="field">
        <div class="field-head">
          <span class="field-label">オルソ画像</span>
          <div class="field-actions">
            <button id="fit-btn" class="mini-btn" type="button" title="整備範囲全体を表示">全体表示</button>
          </div>
        </div>
        <div class="layer-item">
          <label class="toggle">
            <input id="ortho-toggle" type="checkbox" checked />
            <span class="switch"></span>
            <span class="t-label">表示</span>
          </label>
          <div id="ortho-opacity" class="layer-opacity">
            <input id="opacity-range" type="range" min="0" max="1" step="0.05" value="1"
                   aria-label="オルソ画像の不透明度" />
            <span id="opacity-val" class="op-val">100%</span>
          </div>
        </div>
      </div>

      <div class="field">
        <div class="field-head">
          <span class="field-label">データ</span>
        </div>
        <dl id="meta" class="meta"></dl>
      </div>
    </div>

    <footer class="panel-foot">
      <div id="attribution" class="attrib"></div>
      <span id="build-ver" class="build-ver"></span>
    </footer>
  </section>

  <div id="error" class="error" hidden></div>

</body>
</html>
