<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>航空写真タイル プレビュー</title>
  <link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <!-- TILE_OUTPUT="pmtiles" のときだけ使う（グローバル名は pmtiles） -->
  <script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
  <style>
    html, body { margin: 0; height: 100%; }
    #map { position: absolute; inset: 0; }
    #info {
      position: absolute; top: 8px; left: 8px; z-index: 1;
      background: rgba(255, 255, 255, 0.9); padding: 8px 12px; border-radius: 4px;
      font: 12px/1.6 system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
    }
    #info dl { display: grid; grid-template-columns: auto auto; gap: 0 8px; margin: 4px 0 0; }
    #info dt { color: #666; }
    #info dd { margin: 0; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="info"><strong>読み込み中…</strong></div>
  <script>
    // PMTiles は $WORK_DIR 直下、XYZ ディレクトリは tiles/ 配下に置かれる
    const TILEJSON_CANDIDATES = ['tiles.json', 'tiles/tiles.json'];

    (async () => {
      const info = document.getElementById('info');

      let tj = null;
      for (const url of TILEJSON_CANDIDATES) {
        try {
          const res = await fetch(url);
          if (res.ok) { tj = await res.json(); break; }
        } catch (e) { /* 次の候補を試す */ }
      }
      if (!tj) {
        info.innerHTML = `<strong>tiles.json を読み込めません</strong><br>`
          + `探索した場所: ${TILEJSON_CANDIDATES.join(' , ')}`;
        return;
      }

      // TileJSON の tiles[] が本番URLの場合でもローカル確認できるよう相対パスに寄せる
      const declared = tj.tiles?.[0] ?? '';
      const isPmtiles = declared.startsWith('pmtiles://');
      let localTiles;

      if (isPmtiles) {
        maplibregl.addProtocol('pmtiles', new pmtiles.Protocol().tile);
        // pmtiles.js はアーカイブの絶対 URL を要求するため location 基準で解決する
        const suffix = '/{z}/{x}/{y}';
        let archive = declared.slice('pmtiles://'.length);
        if (archive.endsWith(suffix)) archive = archive.slice(0, -suffix.length);
        localTiles = [`pmtiles://${new URL(archive, location.href).href}${suffix}`];
      } else {
        localTiles = [`tiles/{z}/{x}/{y}.${tj.format || 'webp'}`];
      }

      const map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {
            gsi: {
              type: 'raster',
              tiles: ['https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'],
              tileSize: 256,
              maxzoom: 18,
              attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>',
            },
            ortho: {
              type: 'raster',
              tiles: localTiles,
              tileSize: 256,
              minzoom: tj.minzoom,
              maxzoom: tj.maxzoom,
              bounds: tj.bounds,
              attribution: tj.attribution || '',
            },
          },
          layers: [
            { id: 'gsi', type: 'raster', source: 'gsi' },
            { id: 'ortho', type: 'raster', source: 'ortho' },
          ],
        },
        center: [tj.center?.[0] ?? 139.7, tj.center?.[1] ?? 35.7],
        zoom: tj.center?.[2] ?? tj.minzoom ?? 9,
        // 元データより細かく拡大しても情報は増えないが、圧縮ノイズ確認のため +2 まで許可
        maxZoom: (tj.maxzoom ?? 20) + 2,
        hash: true,
      });
      map.addControl(new maplibregl.NavigationControl());
      map.addControl(new maplibregl.ScaleControl());

      if (tj.bounds) map.fitBounds(tj.bounds, { padding: 20, animate: false });

      const render = () => {
        info.innerHTML = `<strong>${tj.name ?? '航空写真タイル'}</strong>
          <dl>
            <dt>形式</dt><dd>${tj.format ?? '-'}</dd>
            <dt>配信</dt><dd>${isPmtiles ? 'PMTiles' : 'XYZ'}</dd>
            <dt>ZL</dt><dd>${tj.minzoom}–${tj.maxzoom}</dd>
            <dt>現在のZ</dt><dd>${map.getZoom().toFixed(2)}</dd>
          </dl>`;
      };
      map.on('load', render);
      map.on('zoom', render);
    })();
  </script>
</body>
</html>
